server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # Never serve these directly - the SQLite db, cached thumbnails, and
    # server-side includes/build files have no business being web-reachable.
    location ~ ^/(data|cache|includes|cli|docker)/ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Movie folders can be large / on slow network shares; give more
        # room than nginx's defaults before giving up.
        fastcgi_read_timeout 60s;
    }

    client_max_body_size 20m; # headroom for manual poster/logo uploads
}
