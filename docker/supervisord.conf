[supervisord]
nodaemon=true
user=root

# Lets `docker exec <container> supervisorctl status` work - without a
# configured control socket, supervisorctl has nothing to connect to and
# fails with ".ini file does not include supervisorctl section" even though
# supervisord itself is running fine.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Runs Sync Library / Batch Process jobs in the background, independent of any
# browser request - see cli/job_worker.php. Runs as www-data (unlike php-fpm,
# which stays root and drops privilege per-worker via its own pool config)
# since this is a single non-forking process that writes to the DB and movie
# library directly; entrypoint.sh has already remapped www-data to
# PUID/PGID by the time supervisord execs this.
[program:job_worker]
command=php /var/www/html/cli/job_worker.php
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
